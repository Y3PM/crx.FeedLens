<!doctype html>
<html class="feedlens-active">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FeedLens</title>
    <link rel="stylesheet" href="reader.css">
  </head>
  <body>
    <main class="br-loading">
      <div class="br-mark">
        <img class="br-brand-icon" src="../icons/icon-48.png" alt="" aria-hidden="true">
      </div>
      <h1 aria-label="LOADING FEED">
        <span style="--i: 0">L</span><span style="--i: 1">O</span><span style="--i: 2">A</span><span style="--i: 3">D</span><span style="--i: 4">I</span><span style="--i: 5">N</span><span style="--i: 6">G</span>
        <span class="br-loading-space" style="--i: 7"> </span>
        <span style="--i: 8">F</span><span style="--i: 9">E</span><span style="--i: 10">E</span><span style="--i: 11">D</span>
      </h1>
    </main>
    <script src="../vendor/purify.min.js"></script>
    <script src="file-access.js"></script>
    <script src="content.js"></script>
  </body>
</html>
